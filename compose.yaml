# 전체 스택(PostgreSQL + backend + frontend)을 이미지로 띄운다. E2E 테스트와 로컬 확인용 (운영 배포용 아님).
# 포트와 DB 계정은 루트 .env 로 바꿀 수 있다 (.env.example 참고).
#
#   (cd backend && ./gradlew bootJar)
#   docker compose up -d --build --wait
#
# http://localhost:3000 (frontend), http://localhost:8080 (backend)
name: template-app

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
    healthcheck:
      # $$ 는 compose 가 아니라 컨테이너 셸에서 환경변수를 읽도록
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 30

  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-app}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-app}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-app}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health | grep -q UP"]
      interval: 3s
      timeout: 3s
      retries: 40

  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8080
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000 > /dev/null"]
      interval: 3s
      timeout: 3s
      retries: 20
