spring:
  application:
    name: backend
  # backend/.env 가 있으면 읽는다 (없으면 무시). 셸/OS 환경변수가 .env 보다 우선한다
  config:
    import: optional:file:.env[.properties]
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mvc:
    problemdetails:
      enabled: true

# 모니터링 (infra/observability 참고)
#   메트릭: 관리 포트의 /actuator/prometheus 를 Alloy가 가져감(pull). 앱이 OTLP로 보내는 메트릭 전송은 끔
#   트레이스: OTLP로 Alloy에 보냄. 스택이 있을 때만 OTLP_TRACING_ENABLED=true
#   로그: 콘솔이 기본. LOG_CONSOLE_FORMAT=logstash 면 콘솔을 JSON으로, LOG_FILE 을 주면 JSON 파일로도 남김. traceId/spanId 포함
management:
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  otlp:
    metrics:
      export:
        # starter-opentelemetry 에 OTLP 메트릭 전송기가 들어 있고 기본으로 켜진다.
        # 메트릭은 pull 로 수집하므로 끈다. 켜 두면 수집기가 없는 곳에서 1분마다 전송 실패 로그가 남는다
        enabled: false
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    export:
      otlp:
        enabled: ${OTLP_TRACING_ENABLED:false}
  opentelemetry:
    resource-attributes:
      service.name: ${spring.application.name}
      deployment.environment: ${APP_ENV:local}
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  file:
    name: ${LOG_FILE:}
  structured:
    format:
      file: logstash
      # 콘솔 로그 형식. 비우면 사람이 읽는 텍스트, logstash 또는 ecs 면 한 줄 JSON (traceId 포함).
      # Docker, k8s 에서 수집기(Alloy, Promtail, Fluent Bit 등)가 컨테이너 로그를 읽을 때 켠다
      console: ${LOG_CONSOLE_FORMAT:}

# API 문서: /swagger-ui.html, /v3/api-docs. 운영에서 숨기려면 API_DOCS_ENABLED=false
springdoc:
  default-produces-media-type: application/json
  model-converters:
    # 코틀린 String? 을 스펙에 "string 또는 null" 로 자동 표시하는 기능. 끄고 @Schema 로 직접 적는다.
    # 자바 버전과 같은 openapi.json(=프론트 타입)을 만들기 위해서다. nullable 응답 필드는 @Schema(types = ["string", "null"])
    kotlin-nullable-property-customizer:
      enabled: false
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:true}
