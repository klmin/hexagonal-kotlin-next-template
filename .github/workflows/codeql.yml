name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 18 * * 0' # 매주 월요일 03:00 KST

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # 코틀린은 build-mode none 으로 분석할 수 없어서 직접 컴파일한다 (jOOQ 코드 생성에 Docker 사용)
          - language: java-kotlin
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality

      - if: matrix.build-mode == 'manual'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - if: matrix.build-mode == 'manual'
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - if: matrix.build-mode == 'manual'
        name: Build backend
        working-directory: backend
        # CodeQL 이 컴파일을 지켜봐야 하므로 빌드 캐시와 데몬을 쓰지 않는다
        run: ./gradlew testClasses --no-daemon --no-build-cache --rerun-tasks

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
