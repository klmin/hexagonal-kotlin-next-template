name: frontend

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'openapi/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - 'openapi/**'
      - '.github/workflows/frontend.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: API 타입이 openapi.json 과 같은지 확인
        run: |
          npm run api:types
          git diff --exit-code src/lib/api/schema.d.ts || (echo "openapi.json 이 바뀌었습니다. frontend 에서 npm run api:types 후 커밋하세요." && exit 1)

      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: 빌드 결과 확인
        run: test -f dist/index.html && ls dist/assets/*.js

      - name: Docker 이미지 빌드 확인
        run: docker build -t frontend .

      # nginx 설정 템플릿에 BACKEND_URL 을 채운 결과가 문법상 맞는지 본다 (실제 /api 프록시는 e2e 워크플로에서 확인)
      - name: nginx 설정 확인
        run: docker run --rm -e BACKEND_URL=http://127.0.0.1:8080 frontend nginx -t
